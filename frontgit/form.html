
<!DOCTYPE html>
<html>

<head>

    <title>Excel Upload</title>

    <style>

        body {
            font-family: Arial;
            margin: 30px;
        }

        input, button {
            padding: 8px;
            margin: 5px;
        }

        button {
            cursor: pointer;
        }

    </style>

</head>


<body>


    <!-- HOME BUTTON -->

    <button
        onclick="window.location.href='index.html'"
        style="
            background:#007bff;
            color:white;
            border:none;
            border-radius:5px;
        ">

        ← Home

    </button>


    <h2>Excel Upload</h2>


    <!-- SELECT EXCEL -->

    <input
        type="file"
        id="excelFile"
        accept=".xlsx,.xls">


    <!-- UPLOAD -->

    <button
        onclick="uploadExcel()">

        Upload Excel → MongoDB

    </button>


<script>


async function uploadExcel() {


    /* GET SELECTED FILE */

    const file =
        document.getElementById("excelFile").files[0];


    if (!file) {

        alert(
            "Please select an Excel file first."
        );

        return;
    }


    alert("Uploading Excel...");


    /* READ FILE */

    const reader =
        new FileReader();


    reader.onload =
        async function(e) {


        try {


            /* CONVERT FILE TO BASE64 */

            const base64 =
                e.target.result.split(",")[1];


            /* SEND TO RENDER */

            const response =
                await fetch(
                    "https://enodeb.onrender.com/upload-excel",
                    {

                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify({
                            file: base64
                        })

                    }
                );


            /* GET SERVER RESPONSE */

            const text =
                await response.text();


            console.log(
                "HTTP Status:",
                response.status
            );


            console.log(
                "Server Response:",
                text
            );


            /* SUCCESS */

            if (response.ok) {

                try {

                    const result =
                        JSON.parse(text);

                    alert(
                        result.message ||
                        "Excel uploaded successfully."
                    );

                } catch {

                    alert(
                        "Excel uploaded successfully."
                    );

                }

                return;
            }


            /* SERVER ERROR */

            alert(
                "Upload failed.\n\n" +
                "HTTP Status: " +
                response.status +
                "\n\n" +
                text
            );


        }


        catch(error) {


            console.error(
                "Upload error:",
                error
            );


            alert(
                "Error connecting to Render.\n\n" +
                error.message
            );

        }

    };


    /* FILE READ ERROR */

    reader.onerror =
        function() {

            alert(
                "Unable to read the Excel file."
            );

        };


    reader.readAsDataURL(file);

}


</script>


</body>

</html>

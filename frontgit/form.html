
<!DOCTYPE html>
<html>

<head>
    <title>Excel Upload</title>

    <style>
        body {
            font-family: Arial;
            margin: 30px;
        }

        input, button {
            padding: 8px;
            margin: 5px;
        }
    </style>
</head>

<body>

    <!-- Home Button -->
    <button onclick="window.location.href='index.html'">
        ← Home
    </button>

    <h2>Excel Upload</h2>

    <!-- Select Excel -->
    <input type="file" id="excelFile" accept=".xlsx,.xls">

    <!-- Upload Excel -->
    <button onclick="uploadExcel()">
        Upload Excel → MongoDB
    </button>


    <script>

    async function uploadExcel() {

        const file =
            document.getElementById("excelFile").files[0];

        if (!file) {
            alert("Please select an Excel file first.");
            return;
        }

        alert("Uploading Excel...");

        const reader = new FileReader();

        reader.onload = async function(e) {

            try {

                const base64 =
                    e.target.result.split(",")[1];

                const response = await fetch(
                    "https://enodeb.onrender.com/upload-excel",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify({
                            file: base64
                        })
                    }
                );

                const result =
                    await response.json();

                alert(
                    result.message ||
                    "Excel uploaded successfully."
                );

            } catch (error) {

                console.error(error);

                alert("Error connecting to Render.");

            }
        };

        reader.readAsDataURL(file);
    }

    </script>

</body>

</html>

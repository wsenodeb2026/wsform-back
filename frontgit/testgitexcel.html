<!DOCTYPE html>
<html>
<head>
    <title>MongoDB Report</title>

    <style>
        body {
            font-family: Arial;
            margin: 30px;
        }

        table {
            border-collapse: collapse;
            margin-top: 20px;
            width: 100%;
        }

        th, td {
            border: 1px solid #999;
            padding: 8px;
        }

        th {
            background-color: #eee;
        }

        input, button {
            padding: 8px;
            margin: 5px;
        }

        .edit-row {
            display: flex;
            align-items: flex-end;
            gap: 15px;
            flex-wrap: wrap;
            margin-top: 15px;
        }
    </style>
</head>

<body>

<!-- HOME BUTTON -->
<div style="margin-bottom:15px;">
    <button onclick="window.location.href='index.html'"
        style="padding:8px 18px;
               background:#007bff;
               color:white;
               border:none;
               border-radius:5px;
               cursor:pointer;">
        ← Home
    </button>
</div>


<h2>MongoDB Report</h2>


<!-- SEARCH -->
<div>
    <input type="text"
           id="searchID"
           placeholder="Enter ID">

    <button onclick="searchRecord()">
        Search
    </button>
</div>


<br>

<!-- SEARCH RESULT / EDIT FORM -->
<div id="searchResult"></div>


<!-- MONGODB TABLE -->
<table id="mongoTable">

    <thead>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Mobile</th>
            <th>Email</th>
            <th>Remarks</th>
            <th>Date</th>
        </tr>
    </thead>

    <tbody id="mongoData">
    </tbody>

</table>


<script>

/* ================================
   LOAD ALL MONGODB DATA
================================ */

async function loadMongoData() {

    try {

        const response = await fetch(
            "https://enodeb.onrender.com/data"
        );

        if (!response.ok) {
            throw new Error("Server error: " + response.status);
        }

        const data = await response.json();

        const tableBody =
            document.getElementById("mongoData");

        tableBody.innerHTML = "";

        data.forEach(function(item) {

            const row = document.createElement("tr");

            row.innerHTML = `
                <td>${item.id || ""}</td>
                <td>${item.name || ""}</td>
                <td>${item.mobile || ""}</td>
                <td>${item.email || ""}</td>
                <td>${item.remarks || ""}</td>
                <td>
                    ${
                        item.createdAt
                        ? new Date(item.createdAt).toLocaleString()
                        : ""
                    }
                </td>
            `;

            tableBody.appendChild(row);

        });

    } catch (error) {

        console.error(error);

        alert("Unable to load MongoDB data.");

    }
}


/* ================================
   SEARCH RECORD BY ID
================================ */

async function searchRecord() {

    const id =
        document.getElementById("searchID").value.trim();

    if (!id) {

        alert("Please enter an ID.");

        return;
    }


    try {

        const response = await fetch(
            "https://enodeb.onrender.com/search/" +
            encodeURIComponent(id)
        );


        if (!response.ok) {

            throw new Error(
                "Server error: " + response.status
            );

        }


        const result = await response.json();


        const resultDiv =
            document.getElementById("searchResult");


        if (!result.success) {

            resultDiv.innerHTML =
                "<p style='color:red;'>Record not found.</p>";

            return;
        }


        const record = result.data;


        resultDiv.innerHTML = `

            <div class="edit-row">

                <div>
                    <b>ID:</b><br>
                    <input type="text"
                           value="${escapeHtml(record.id || id)}"
                           readonly>
                </div>


                <div>
                    <b>Name:</b><br>
                    <input type="text"
                           id="editName"
                           value="${escapeHtml(record.name || "")}">
                </div>


                <div>
                    <b>Mobile:</b><br>
                    <input type="text"
                           id="editMobile"
                           value="${escapeHtml(record.mobile || "")}">
                </div>


                <div>
                    <b>Email:</b><br>
                    <input type="email"
                           id="editEmail"
                           value="${escapeHtml(record.email || "")}">
                </div>


                <div>
                    <b>Remarks:</b><br>
                    <input type="text"
                           id="editRemarks"
                           value="${escapeHtml(record.remarks || "")}"
                           style="width:250px;">
                </div>


                <div>
                    <button
                        onclick="saveMongoRecord('${escapeHtml(record.id || id)}')"
                        style="
                            background:#28a745;
                            color:white;
                            border:none;
                            border-radius:5px;
                            cursor:pointer;
                        ">
                        Save Changes
                    </button>
                </div>

            </div>
        `;

    } catch (error) {

        console.error(error);

        alert("Unable to connect to Render server.");

    }

}


/* ================================
   SAVE UPDATED RECORD
================================ */

async function saveMongoRecord(id) {

    const record = {

        id: id,

        name:
            document.getElementById("editName").value.trim(),

        mobile:
            document.getElementById("editMobile").value.trim(),

        email:
            document.getElementById("editEmail").value.trim(),

        remarks:
            document.getElementById("editRemarks").value.trim()

    };


    try {

        const response = await fetch(
            "https://enodeb.onrender.com/update-record",
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify(record)
            }
        );


        const result = await response.json();


        if (result.success) {

            alert("MongoDB updated successfully.");

            /*
             * Reload the page after saving.
             * This will show the updated MongoDB data.
             */
            location.reload();

        } else {

            alert(
                "Update failed: " +
                (result.message || "Unknown error")
            );

        }

    } catch (error) {

        console.error(error);

        alert("Unable to connect to Render server.");

    }

}


/* ================================
   ESCAPE HTML
================================ */

function escapeHtml(value) {

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


/* ================================
   LOAD DATA WHEN PAGE OPENS
================================ */

loadMongoData();

</script>

</body>
</html>
```
